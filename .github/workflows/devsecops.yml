name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  security-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # NEW — Access Control Enforcement (Python)
    - name: Enforce Access Control Policy
      run: |
        mkdir -p logs
        python scripts/access_control.py \
          ${{ github.actor }} \
          "developers" \
          "staging"

    # NEW — Access Control Verification (PowerShell)
    - name: Verify Authorized Deployer
      shell: pwsh
      run: |
        ./scripts/access_control.ps1 `
          -GitHubActor "${{ github.actor }}"

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ \
          --cov=app \
          --cov-report=xml:coverage.xml \
          --cov-report=term-missing

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # NEW — Upload Access Audit Log
    - name: Upload Access Audit Trail
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: access-audit-log
        path: logs/access_audit.log
