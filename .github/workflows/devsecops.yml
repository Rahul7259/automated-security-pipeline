name: DevSecOps Pipeline - SAST with SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  security-scan:
    name: Security Scan with SonarCloud
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run tests with coverage
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing
        continue-on-error: true  # Don't block pipeline if tests fail

      # Step 5: SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Rahul7259_automated-security-pipeline
            -Dsonar.organization=rahul7259

      # Step 6: Check Quality Gate
      - name: Check SonarCloud Quality Gate
        run: |
          echo "Quality Gate status will be visible in SonarCloud dashboard"
